name: stable-ci

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]
  workflow_dispatch:

jobs:
  ci:
    name: lint formulas
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruby syntax check
        # Matches the original Codeberg Woodpecker pipeline.
        # Catches Ruby syntax errors in any formula before merge.
        run: find Formula projects -type f -name '*.rb' -exec ruby -c {} +

      - name: brew style
        # `brew audit` no longer accepts file paths in modern Homebrew.
        # `brew style` does, and catches the same whitespace/quoting issues.
        run: brew style Formula/*.rb