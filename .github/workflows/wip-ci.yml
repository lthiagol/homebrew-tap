name: wip-ci

on:
  push:
    branches: [wip]
  pull_request:
    branches: [wip]
  workflow_dispatch:

jobs:
  ci:
    name: lint formulas
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ruby syntax check
        run: find Formula projects -type f -name '*.rb' -exec ruby -c {} +

      - name: brew style
        run: brew style Formula/*.rb